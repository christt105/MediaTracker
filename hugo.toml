title = "Media Tracker"
baseURL = 'https://christt105.github.io/MediaTracker/'
languageCode = 'es-es'
defaultContentLanguage = "es"
enableEmoji = true

[outputs]
  home = ["HTML", "RSS", "JSON", "RSS_FINISHED"]

[outputFormats]
[outputFormats.RSS_FINISHED]
  mediaType = "application/rss+xml"
  baseName = "finished"
  isPlainText = true
  notAlternative = true

[module]
  [[module.imports]]
    path = "github.com/christt105/hugo-mediatracker-theme"

# The type sections (movies/tv/games) redirect to the home page filtered by
# that type, so the Biblioteca dropdown links to them via pageRef and the
# redirect lands on /?type=<type>.
[menu]
  [[menu.main]]
    identifier = 'library'
    pageRef = '/'
    name = 'Biblioteca'
    url = '/'
    weight = 20
  [[menu.main]]
    parent = 'library'
    pageRef = 'movies'
    name = 'Películas'
    url = '/movies/'
    weight = 1
  [[menu.main]]
    parent = 'library'
    pageRef = 'tv'
    name = 'Series'
    url = '/tv/'
    weight = 2
  [[menu.main]]
    parent = 'library'
    pageRef = 'games'
    name = 'Juegos'
    url = '/games/'
    weight = 3
  [[menu.main]]
    pageRef = 'collage'
    name = 'Collage'
    url = '/collage/'
    weight = 50
  [[menu.main]]
    pageRef = 'stats'
    name = 'Estadísticas'
    url = '/stats/'
    weight = 55
  [[menu.main]]
    pageRef = 'about'
    name = 'Acerca de'
    url = '/about/'
    weight = 60

[params]
  sitename = "Media Tracker"
  defaultColor = "dark"
  description = "Mi colección personal de películas, series y videojuegos."
  mainSections = ['movies', 'games', 'tv'] 

  toc = false 
  goToTop = true
  dateFormat = "2 Jan 2006"

[params.author]
  avatar = "avatar.webp"
  intro = "Media Tracker"
  name = "christt105"
  description = "Este es mi rincón personal donde guardo un registro de todas las películas, series y videojuegos que consumo."

[[params.socialIcons]]
name = "github"
url = "https://github.com/christt105"

[[params.socialIcons]]
name = "rss"
url = "/MediaTracker/index.xml"

[params.footer]
since = 2025
customText = ""